name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python sources
        run: python -m compileall -q taskflow

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TaskFlow --collect-all keyring taskflow/__main__.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer/TaskFlow.iss

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows
          path: dist/TaskFlow.exe

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows-Installer
          path: dist/installer/TaskFlow-Setup.exe
