name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --windowed --name TaskFlow taskflow/__main__.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Windows
          path: dist/TaskFlow
