[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow"
version = "0.1.0"
description = "Windows desktop task list and agenda application"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
taskflow = "taskflow.app:main"
